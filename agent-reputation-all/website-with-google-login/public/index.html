<script>

function tx(fn,d){var n=S.chain.length,b={n:n,fn:fn,data:JSON.stringify(d),prev:n?S.chain[n-1].hash:'0x0'};b.hash=bh(b);S.chain.push(b);S.v=null;hFromTx(fn,d)}

function rep(a){return a.ratings.length?a.ratings.reduce(function(x,y){return x+y},0)/a.ratings.length:null}

var id='AGT-'+h(n+S.agents.length+S.wallet).slice(0,6).toUpperCase();S.agents.push({id:id,name:n,spec:s||'General tasks',owner:S.wallet,ratings:[]});tx('registerAgent',{id:id,owner:S.wallet});

function mk(a,d,q){if(!need())return;if(!q){a=selA;d=$('f2').value.trim()}if(!a){toast('Add an agent first');return}if(!d){toast('Describe the task');return}
var t={id:'T'+(++S.seq),aid:a,desc:d,st:0,rating:null,out:null,ts:Date.now()};S.tasks.push(t);tx('createTask',{task:t.id,agent:a,user:S.wallet});
if(!q){closeS();tab='tasks';save();render();toast('Task created')}return t}

function rate(id,v,q){if(!need())return;var t=tk(id),a=ag(t.aid);t.st=3;t.rating=v;a.ratings.push(v);tx('rateTask',{task:id,rating:v,by:S.wallet});if(!q){save();render();toast(a.name+' is now rated '+rep(a).toFixed(2))}}

function tamper(){if(S.chain.length<2){toast('Add some activity first');return}S.chain[1].data=S.chain[1].data.replace(/[0-9A-Za-z]/,'X');save();render();toast('Block 1 changed. Tap Verify chain.')}
function wipe(){S={agents:[],tasks:[],chain:[],wallet:S.wallet,user:S.user,accounts:S.accounts,hist:S.hist,seq:0,bad:-1,v:null};logH('Cleared all data');save();render()}
function demo(){qH=true;if(!S.wallet)connect();
var D=[['SummarizerBot','Text summaries',['Summarize a news article','Summarize meeting notes','Condense a research paper','Summarize a product review'],[5,4,5,3]],
['CodeHelper','Code review',['Review a Python function','Check a login form','Refactor a SQL query','Review an API endpoint'],[4,4,5,5]],
['TranslateAI','Translation',['Translate a menu to Spanish','Translate an email to French','Translate app text to German'],[5,5,4]],
['DataDigger','Spreadsheet analysis',['Find trends in sales data','Summarize survey results'],[3,4]],
['ImageCaptioner','Image captions',['Caption a travel photo','Describe a product image','Write alt text for a chart'],[4,5,4]],
['MathTutor','Math tutoring',['Explain fractions','Solve a word problem','Check algebra homework','Prepare a geometry quiz'],[5,5,5,4]],
['LegalLens','Contract review',['Review a rental agreement','Summarize terms of service','Flag risky clauses'],[3,4,3]],
['TravelPlanner','Trip planning',['Plan a weekend in Rome','Find budget hotels'],[4,5]]],ids=[],k=0;
D.forEach(function(d){var id=reg(d[0],d[1],1);ids.push(id);d[3].forEach(function(v,i){var t=mk(id,d[2][i],1);t.ts=Date.now()-(++k)*5400000;t.st=1;fin(t.id,1);rate(t.id,v,1)})});
function addT(i,desc,st){var t=mk(ids[i],desc,1);t.ts=Date.now()-(++k)*1200000;if(st>0){t.st=1;t.out='Finished in '+(250+k*37)+' ms (simulated)'}if(st>1)fin(t.id,1)}
addT(3,'Clean a sales spreadsheet',0);addT(7,'Plan a 3-day Tokyo trip',0);addT(1,'Review a checkout page',1);addT(2,'Translate a product page to French',2);addT(5,'Explain quadratic equations',2);
qH=false;logH('Loaded demo agents');save();render();toast('Demo data loaded')}
function openS(k,pre){if(!need())return;var p=$('pane'),hd=function(t,a){return'<div class="ph"><button class="link" onclick="closeS()">Cancel</button><b>'+t+'</b><button class="link" style="font-weight:600" onclick="'+a+'">Done</button></div>'};
if(k==='reg')p.innerHTML=hd('New Agent','reg()')+'<label for="f1">Name</label><div class="fw"><input id="f1" maxlength="28" placeholder="SummarizerBot"><button class="mic" onclick="mic(\'f1\',this)" aria-label="Speak the name">'+MIC+'</button></div><label for="f2">Specialty</label><div class="fw"><input id="f2" maxlength="40" placeholder="Text summaries"><button class="mic" onclick="mic(\'f2\',this)" aria-label="Speak the specialty">'+MIC+'</button></div>';
else{if(!S.agents.length){toast('Add an agent first');return}selA=pre||S.agents[0].id;p.innerHTML=taskSheet()}
$('sheet').className='sheet on';if(k==='reg')setTimeout(function(){$('f1').focus()},60);else setTimeout(centerA,40)}
